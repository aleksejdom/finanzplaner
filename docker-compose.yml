services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # Die PostgreSQL-Datenbank läuft extern (z. B. als eigener Coolify-Dienst)
    # und wird ausschließlich über DATABASE_URL in .env.local angesprochen.
